[project]
name = "healthcare-sepsis-ai"
version = "0.1.0"
description = "Healthcare SepsisAI: reproducible sepsis research and agentic evidence exploration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
  "langgraph>=1,<2", "httpx>=0.28,<1", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
research = ["xgboost>=3,<4", "catboost>=1.2,<2", "torch>=2.6", "mlflow>=3,<4", "shap>=0.47"]
retrieval = ["sentence-transformers>=3", "qdrant-client>=1.13"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_sepsis_ai"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

